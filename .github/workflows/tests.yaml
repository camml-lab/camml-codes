name: Dynamic Submodule Test Runner

on: [ push, pull_request, workflow_dispatch ]

jobs:
   # 1. SETUP JOB: Prepares the environment
   setup_env:
      runs-on: ubuntu-latest
      steps:
         -  name: Checkout Code and Submodules
            uses: actions/checkout@v4
            with:
               submodules: true
               token: ${{ secrets.CAMML_READ_TOKEN }}

         -  name: Set up uv
            uses: astral-sh/setup-uv@v5
            with:
               python-version: '3.13'
               enable-cache: true

         -  name: Sync dependencies
            run: uv sync --all-extras

   # 2. TEST JOB: Runs tests in parallel using the cached environment
   test_submodules:
      runs-on: ubuntu-latest
      needs: setup_env
      strategy:
         fail-fast: false
         matrix:
            submodule_path: [ reax, tensorial, e3md, e3response, e3gen ]

      steps:
         -  name: Checkout Code
            uses: actions/checkout@v4
            with:
               submodules: true
               token: ${{ secrets.CAMML_READ_TOKEN }}

         -  name: Set up uv
            uses: astral-sh/setup-uv@v5
            with:
               python-version: '3.13'
               enable-cache: true

         -  name: Run Test for ${{ matrix.submodule_path }}
            run: |
               echo "Running tests for ${{ matrix.submodule_path }}..."
               uv run pytest ./${{ matrix.submodule_path }}/tests
