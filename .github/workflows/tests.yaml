name: Dynamic Submodule Test Runner

on: [ push, pull_request, workflow_dispatch ]

jobs:
   test_submodules:
      runs-on: ubuntu-latest
      strategy:
         fail-fast: false
         matrix:
            submodule_path: [ reax, tensorial, e3md, e3response, e3gen ]

      steps:
         -  name: Checkout Code and Submodules
            uses: actions/checkout@v4
            with:
               submodules: true
               token: ${{ secrets.CAMML_READ_TOKEN }}

         -  name: Set up uv
            uses: astral-sh/setup-uv@v5
            with:
               python-version: '3.13'
               enable-cache: true  # This pulls the cached packages instantly

         # 1. You MUST build the workspace environment on this specific machine
         -  name: Sync workspace dependencies
            run: uv sync --all-packages --all-extras

         # 2. Now 'uv run' will successfully find pytest in the workspace environment
         -  name: Run Test for ${{ matrix.submodule_path }}
            run: |
               echo "Running tests for ${{ matrix.submodule_path }}..."
               uv run pytest ./${{ matrix.submodule_path }}/tests